name: Phase 2 quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  booking-input-regression:
    name: Booking input regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements-test.txt
      - run: python -m pytest -q --tb=short tests/team/api/test_smoke_high_risk.py -k test_d5 -s --junitxml=booking-input.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-input-regression
          path: booking-input.xml

  white-box:
    name: White-box coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements-test.txt
      - run: |
          mkdir evidence
          python -m pytest tests/team/unit -q -s --tb=short --junitxml=evidence/unit.xml --cov=backend --cov-branch --cov-report=json:evidence/coverage.json --cov-report=html:evidence/htmlcov --cov-report=xml:evidence/coverage.xml
          python tests/team/tools/phase2_metrics.py mcc evidence/unit.xml evidence
          python tests/team/tools/phase2_metrics.py coverage evidence/coverage.json evidence/scoped.json --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: white-box-coverage
          path: evidence/

  api:
    name: API and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements-test.txt
      - run: |
          python tests/team/tools/generate_appointment_cases.py tests/team/data/appointments.openapi.yaml regenerated.json
          cmp tests/team/data/appointment_cases.json regenerated.json
          python -m pytest tests/team/api -q -s --tb=short -o junit_family=legacy --junitxml=api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-integration
          path: api.xml

  chromium:
    name: Chromium use cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r backend/requirements.txt -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - run: |
          assets="$RUNNER_TEMP/medihub-assets"
          mkdir -p "$assets" evidence
          curl -fsSL https://unpkg.com/vue@3.5.46/dist/vue.global.js -o "$assets/vue.global.js"
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js -o "$assets/bootstrap.bundle.min.js"
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css -o "$assets/bootstrap.min.css"
          export MEDIHUB_BROWSER_ASSETS="$assets"
          python -m pytest tests/team/e2e --browser chromium -q --tb=short --junitxml=evidence/browser.xml --html=evidence/browser.html --self-contained-html --screenshot on --tracing retain-on-failure --output evidence/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-use-cases
          path: evidence/

  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements-test.txt
      - run: python tests/team/tools/phase2_mutation.py mutation-evidence --enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-analysis
          path: mutation-evidence/

  sonar:
    name: SonarQube full scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements-test.txt
      - name: Start a loopback-only analysis service
        run: |
          docker run -d --name medihub-ci-sonar -p 127.0.0.1:9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube@sha256:7b2296713a92b8ea0dd7a083a25faadc59376c9a1e6daf2744a89711c54ea1ba
          for step in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/api/system/status | jq -e '.status == "UP"' >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 80 medihub-ci-sonar
          exit 1
      - name: Generate coverage and scan the PR checkout
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir evidence
          python -m pytest tests/team/unit tests/team/api -q --tb=short --cov=backend --cov-branch --cov-report=xml:coverage.xml
          export SONAR_HOST_URL=http://127.0.0.1:9000
          # This token exists only in this job's isolated, newly bootstrapped instance.
          SONAR_TOKEN=$(curl -fsS -u admin:admin -X POST "${SONAR_HOST_URL}/api/user_tokens/generate" --data-urlencode name=ci-analysis | jq -er '.token')
          echo "::add-mask::$SONAR_TOKEN"
          export SONAR_TOKEN
          # Community Build scans the checked-out merge revision as a full project.
          # Seed its temporary history from the actual target branch revision.
          project="medihub-pr-$PR_NUMBER"
          baseline_dir="$RUNNER_TEMP/medihub-sonar-base"
          git clone --quiet --shared --no-checkout "$GITHUB_WORKSPACE" "$baseline_dir"
          git -C "$baseline_dir" checkout --quiet --detach "$BASE_SHA"
          cp sonar-project.properties "$baseline_dir/sonar-project.properties"
          scan() {
            env -u GITHUB_WORKFLOW -u GITHUB_ACTIONS GITHUB_EVENT_NAME=workflow_dispatch \
              pysonar "-Dsonar.projectKey=$project" -Dsonar.qualitygate.wait=true "$@"
          }
          baseline_date=$(git show -s --format=%cs "$BASE_SHA")
          (
            cd "$baseline_dir"
            scan "-Dsonar.projectVersion=base-$BASE_SHA" "-Dsonar.projectDate=$baseline_date" \
              "-Dsonar.scm.revision=$BASE_SHA"
          ) 2>&1 | tee evidence/sonar-baseline.txt

          revision=$(git rev-parse HEAD)
          scanner=0
          if scan "-Dsonar.projectVersion=candidate-$revision" "-Dsonar.scm.revision=$revision" 2>&1 | tee evidence/sonar.txt; then
            echo "Scanner and native gate passed"
          else
            scanner=$?
          fi
          # Export the project-wide checks even when the native gate failed.
          overall=0
          if python tests/team/tools/sonar_gate.py "$project" evidence/sonar-measures.json \
            --baseline "$BASE_SHA" --revision "$revision"; then
            echo "Overall gate passed"
          else
            overall=$?
          fi
          test "$scanner" -eq 0 && test "$overall" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube
          path: |
            evidence/
            coverage.xml
